name: Build APK JISA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar carpeta android
        run: flutter create --platforms=android --org cr.jisa --project-name jisa_fletes .

      - name: Permitir acceso a Internet
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          grep -n "INTERNET" $MANIFEST

      - name: Nombre visible de la app
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Fletes JISA"|' android/app/src/main/AndroidManifest.xml

      - name: Dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: calculador-fletes-jisa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
